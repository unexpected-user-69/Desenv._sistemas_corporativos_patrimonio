name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/packages/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - users-service
          - auth-service
          - patrimonio-service
          - categorias-service
          - audit-service
          - events-service
          - api-gateway

env:
  REGISTRY: ghcr.io
  OWNER: unexpected-user-69

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: users-service
            context: ./backend/packages/users-service
            port: 3002
          - name: auth-service
            context: ./backend/packages/auth-service
            port: 3001
          - name: patrimonio-service
            context: ./backend/packages/patrimonio-service
            port: 3003
          - name: categorias-service
            context: ./backend/packages/categorias-service
            port: 3004
          - name: audit-service
            context: ./backend/packages/audit-service
            port: 3005
          - name: events-service
            context: ./backend/packages/events-service
            port: 3006
          - name: api-gateway
            context: ./backend/packages/api-gateway
            port: 3100

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

