version: '3.9'
services:
  aurora_db:
    image: postgres:16
    container_name: patrimonio_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-patrimonio_inventario}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-patrimonio_inventario}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:

