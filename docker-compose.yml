# Docker Compose para orquestração completa do projeto
# Backend (NestJS) + Frontend (React) + Database (PostgreSQL)

version: '3.9'

services:
  # Serviço de banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: patrimonio_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-patrimonio_inventario}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-patrimonio_inventario}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - patrimonio_network

  # Serviço do backend NestJS
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrimonio_inventario_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-patrimonio_inventario}
      NODE_ENV: production
      PORT: 3101
    ports:
      - "${BACKEND_PORT:-3101}:3101"
    networks:
      - patrimonio_network

  # Serviço do frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patrimonio_inventario_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-3101}
      VITE_APP_NAME: Patrimônio Inventário
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - patrimonio_network

  # Service for running tests/migrations with source & dev dependencies mounted
  backend-test:
    image: node:22-bullseye-slim
    container_name: patrimonio_inventario_backend_test
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-patrimonio_inventario}
      NODE_ENV: development
      PORT: 3101
    working_dir: /usr/src/app
    volumes:
      - ./backend:/usr/src/app:cached
    networks:
      - patrimonio_network

# Rede dedicada para comunicação entre serviços
networks:
  patrimonio_network:
    driver: bridge

# Volume persistente para dados do PostgreSQL
volumes:
  db_data:
